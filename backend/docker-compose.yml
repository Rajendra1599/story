version: '3.8'

services:
  # MicroDrama API Node 1
  api-1:
    build: .
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=*
    ports:
      - "5000:5000"
    depends_on:
      - redis

  # MicroDrama API Node 2 (Horizontal Scaling Replica)
  api-2:
    build: .
    restart: always
    environment:
      - PORT=5001
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=*
    ports:
      - "5001:5001"
    depends_on:
      - redis

  # Redis Cluster / Cache & BullMQ Queue Store
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
