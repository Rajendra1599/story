apiVersion: v1
kind: Service
metadata:
  name: microdrama-api-service
  namespace: default
  labels:
    app: microdrama-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: microdrama-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: microdrama-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  tls:
    - hosts:
        - api.microdrama.example.com
      secretName: microdrama-tls-cert
  rules:
    - host: api.microdrama.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: microdrama-api-service
                port:
                  number: 80
