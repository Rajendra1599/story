global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "microdrama-backend-cluster"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api-1:5000", "api-2:5001"]
        labels:
          environment: "production"
          service: "microdrama-api"
