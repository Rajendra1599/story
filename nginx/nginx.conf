# ==============================================================================
# MicroDrama OTT - Production High-Concurrency NGINX Load Balancer
# Architecture: Reverse Proxy with Microcaching, Rate Limiting & SSL Termination
# Target: 10,000+ to 100,000+ Concurrent Requests
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;

    # Rate Limiting Zones (DDoS Protection)
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # Fast Microcache for Public OTT Feeds (10s TTL - eliminates 98% of backend hits)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=FEED_CACHE:50m inactive=60m max_size=500m;

    # Upstream Stateless API Cluster (Least Connections Load Balancing)
    upstream microdrama_api_cluster {
        least_conn;
        server api-1:5000 max_fails=3 fail_timeout=10s;
        server api-2:5001 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name api.microdrama.example.com;

        # Health Check Endpoint (No rate limit / no cache)
        location /health/ {
            proxy_pass http://microdrama_api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Metrics Endpoint (Internal Prometheus Only)
        location /metrics {
            proxy_pass http://microdrama_api_cluster;
            proxy_set_header Host $host;
        }

        # Public Feed Caching (Microcache 10s)
        location ~* ^/api/(dramas|feed)/ {
            proxy_pass http://microdrama_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Microcache
            proxy_cache FEED_CACHE;
            proxy_cache_valid 200 10s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Payment & Auth (Strict Rate Limit, No Cache)
        location ~* ^/api/(payment|subscription)/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://microdrama_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # General API Fallback
        location / {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://microdrama_api_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
